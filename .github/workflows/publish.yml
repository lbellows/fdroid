# Build and publish the F-Droid repository index to GitHub Pages.
#
# Every app listed in apps.json contributes the APKs attached to its GitHub
# releases, plus the fastlane store listing from its source tree. Adding an app
# is one line in apps.json -- nothing here is app-specific.
#
# Runs nightly, on a push to main, and on demand. An app repo can also trigger
# it immediately after publishing a release via repository_dispatch.
name: Publish F-Droid repo

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [app-released]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fdroid-repo
  cancel-in-progress: false

env:
  PAGES_URL: https://lbellows.github.io/fdroid

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # fdroidserver shells out to apksigner, and the badging step to aapt2;
      # both live in build-tools. Name the packages explicitly -- the action's
      # default set includes the obsolete "tools", which Google has removed
      # from the SDK repository, so the default install now fails outright.
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;37.0.0'

      - name: Install fdroidserver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-yaml
          pipx install fdroidserver
          fdroid --version

      - name: Collect APKs and store listings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p fdroid/repo fdroid/metadata
          jq -c '.[]' apps.json | while read -r app; do
            repo=$(jq -r .repo <<<"$app")
            appid=$(jq -r .appid <<<"$app")
            echo "::group::$repo ($appid)"

            # Every release, so the repo carries history and someone on an old
            # version still sees a path forward.
            for tag in $(gh release list --repo "$repo" --limit 100 --json tagName -q '.[].tagName'); do
              gh release download "$tag" --repo "$repo" --pattern '*.apk' \
                --dir fdroid/repo --clobber || true
            done

            # fdroid reads descriptions and images from metadata/<appid>/<locale>/,
            # which is the layout fastlane already uses.
            src=$(mktemp -d)
            git clone --depth 1 "https://github.com/$repo.git" "$src/app" --quiet
            if [ -d "$src/app/fastlane/metadata/android" ]; then
              for loc in "$src/app"/fastlane/metadata/android/*/; do
                dest="fdroid/metadata/$appid/$(basename "$loc")"
                mkdir -p "$dest"
                cp -r "$loc". "$dest"/
              done
            else
              echo "::warning::$repo has no fastlane metadata; listing will be sparse"
            fi

            # License, Categories and SourceCode come from metadata/<appid>.yml,
            # not from the fastlane tree. Lift them from the app's own fdroiddata
            # recipe so they cannot drift from what it submits upstream.
            recipe=$(jq -r '.recipe // empty' <<<"$app")
            if [ -n "$recipe" ] && [ -f "$src/app/$recipe" ]; then
              python3 scripts/app_metadata.py "$src/app/$recipe" "$appid" fdroid/metadata \
                "$(jq -r '.signing_key // empty' <<<"$app")"
            else
              echo "::warning::$repo has no recipe at '$recipe'; app will publish as licence Unknown"
            fi

            rm -rf "$src"
            echo "::endgroup::"
          done

          ls -la fdroid/repo
          test -n "$(ls fdroid/repo/*.apk 2>/dev/null)" || { echo "::error::no APKs found"; exit 1; }

      - name: Drop superseded APKs
        run: |
          set -euo pipefail
          # Releases predating the per-ABI split shipped one universal APK of
          # ~95 MB carrying four architectures. Clients rank them below the
          # current builds so nothing breaks, but serving them burns Pages
          # bandwidth and contradicts the listing beside them. min_versioncode
          # in apps.json is the first release worth publishing.
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          for apk in fdroid/repo/*.apk; do
            # Anchor on the badging header. Matching name=' unanchored finds
            # compileSdkVersionCodename instead, and versionCode=' finds
            # platformBuildVersionCode -- both silently, leaving nothing pruned.
            line=$("$aapt2" dump badging "$apk" | grep -m1 '^package: ')
            pkg=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<<"$line")
            code=$(sed -n "s/^package: name='[^']*' versionCode='\([0-9]*\)'.*/\1/p" <<<"$line")
            if [ -z "$pkg" ] || [ -z "$code" ]; then
              echo "::error::could not read package/versionCode from $apk"; exit 1
            fi
            min=$(jq -r --arg p "$pkg" '.[] | select(.appid==$p) | .min_versioncode // 0' apps.json)
            min=${min:-0}
            if [ "$code" -lt "$min" ]; then
              printf 'dropping %s (%s code %s < %s, %s MB)\n' \
                "$(basename "$apk")" "$pkg" "$code" "$min" "$(( $(stat -c%s "$apk") / 1000000 ))"
              rm -f "$apk"
            else
              printf 'keeping  %s (%s code %s)\n' "$(basename "$apk")" "$pkg" "$code"
            fi
          done
          ls -la fdroid/repo

      - name: Build and sign the index
        env:
          KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::FDROID_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ks.p12"
          cd fdroid
          umask 077
          cat > config.yml <<CONFIG
          repo_url: $PAGES_URL/repo
          repo_name: lbellows
          repo_description: >-
            Android apps by lbellows, built and signed from source. No analytics,
            no advertising, no trackers.
          archive_older: 0
          keystore: $RUNNER_TEMP/ks.p12
          repo_keyalias: fdroidrepo
          keystorepass: $KEYSTORE_PASSWORD
          keypass: $KEYSTORE_PASSWORD
          CONFIG
          fdroid update --create-metadata --pretty --delete-unknown
          rm -f config.yml
          ls repo/

      - name: Verify every app made it into the index
        run: python3 scripts/verify_index.py

      - name: Assemble the site
        env:
          KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ks.p12"
          FP=$(keytool -list -v -keystore "$RUNNER_TEMP/ks.p12" -storetype PKCS12 \
                 -alias fdroidrepo -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
               | grep -m1 'SHA256:' | awk '{print $2}' | tr -d ':')
          test -n "$FP" || { echo "::error::could not read the index fingerprint"; exit 1; }
          echo "index fingerprint: $FP"
          mkdir -p site
          cp -r fdroid/repo site/repo
          python3 scripts/build_site.py "$PAGES_URL/repo" "$FP"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
